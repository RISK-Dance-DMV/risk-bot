# Daily application jobs (design doc rank 22).
#
#   1. Backstop        - the form trigger fails silently, which looks exactly like
#                        "no applications came in". Reads the sheet directly.
#   2. Audition reconcile - clears anyone who did submit off `awaiting`, before
#                        the sweep decides who ran out of time.
#   3. Stale sweep     - closes RISK-audition-process cards whose window ran out.
#   4. Waitlist revisit - resurfaces anyone past their revisit date.
#
# Scheduled Actions run 5-30 minutes late; nothing here assumes a minute.
name: applications-daily

on:
  schedule:
    - cron: "20 13 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Run daily application jobs
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INBOUND_SECRET: ${{ secrets.INBOUND_SECRET }}
        run: |
          # GitHub starts this shell as `bash -e`, so a failing curl would exit
          # before the echo. Clearing -e is what makes the error message reachable.
          set +e -uo pipefail

          # --fail-with-body, not -f: a bare -f throws the response away, which
          # turns every failure into an opaque "exit code 22" instead of the
          # message the Worker went to the trouble of writing.
          body=$(curl -sS --fail-with-body -X POST \
            -H "X-RISK-Secret: ${INBOUND_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${WORKER_URL%/}/jobs/applications-daily")
          status=$?

          echo "$body"
          exit $status
