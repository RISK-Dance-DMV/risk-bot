# Actions disables scheduled workflows after 60 days of repo inactivity, which
# would silently stop the backstop (design doc s1). A weekly commit prevents it.
name: keepalive

on:
  schedule:
    - cron: "15 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "risk-bot"
          git config user.email "risk-bot@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive"
          git push
