# Re-pings drafts still unactioned 48h before the date they reference
# (design doc rank 6). Scheduled Actions run 5-30 minutes late; nothing here
# assumes a minute.
name: drafts-sweep

on:
  schedule:
    - cron: "40 13 * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep drafts
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INBOUND_SECRET: ${{ secrets.INBOUND_SECRET }}
        run: |
          # GitHub starts this shell as `bash -e`, so a failing curl would exit
          # before the echo. Clearing -e is what makes the error message reachable.
          set +e -uo pipefail

          # --fail-with-body so a failure prints the Worker's explanation rather
          # than a bare exit code.
          body=$(curl -sS --fail-with-body -X POST \
            -H "X-RISK-Secret: ${INBOUND_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${WORKER_URL%/}/jobs/drafts-sweep")
          status=$?

          echo "$body"
          exit $status
